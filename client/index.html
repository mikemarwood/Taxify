<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The same mark as logo.svg, redrawn for 16 pixels. See favicon.svg.

      The SVG on its own was not enough on a phone. Safari on iOS ignores SVG
      icons completely and wants a PNG apple-touch-icon — the /logo.svg here was
      never going to work — and Android Chrome takes its icon from the web
      manifest, which did not exist. So the tab showed a blank page glyph on
      exactly the devices most people open this on.

      The PNGs are rendered from favicon.svg's own geometry, so they cannot
      drift from it. Desktop browsers still prefer the SVG: it is listed first
      and stays sharp at any zoom.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1559b8" />
    <title>Taxify — Expenses and receipts, ready for tax time</title>
    <meta
      name="description"
      content="Photograph a receipt and Taxify files it — right category, right tax year. Come tax time the whole year is already added up."
    />
    <!-- The app itself is behind a login, so there is nothing here for a search
         engine to index and following links into it only burns crawl budget on
         pages that will answer with a sign-in form. The landing page is what
         should rank; it says so with its own canonical. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Meta Pixel.

         Here rather than in the React bundle so a PageView is recorded when the
         document loads, before the app has mounted. Route changes inside the
         app are not reported: this is a single page, Meta counts the one load,
         and firing a PageView per screen would inflate every figure it feeds.

         autoConfig is switched off, deliberately and before init.

         Left on, the pixel reads the page for itself: it watches button presses
         and form submissions and sends back the values of fields it decides
         look like contact details. On this domain those fields are somebody's
         name, email, date of birth and phone number, and further in they are
         expense amounts and receipt details. None of that is Meta's to have,
         and none of it is needed to know that a trial started. Off, the pixel
         reports only the events written by hand — a PageView here and a
         CompleteRegistration on the line after an account is created, neither
         carrying a parameter.

         The id is public by nature; it is visible in this page to anybody who
         looks, and identifies the ad account rather than granting access to
         it. -->
    <script>
      !(function (f, b, e, v, n, t, s) {
        if (f.fbq) return;
        n = f.fbq = function () {
          n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
        };
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = !0;
        n.version = '2.0';
        n.queue = [];
        t = b.createElement(e);
        t.async = !0;
        t.src = v;
        s = b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t, s);
      })(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
      fbq('set', 'autoConfig', false, '957172023312324');
      fbq('init', '957172023312324');
      fbq('track', 'PageView');
    </script>
  </head>
  <body>
    <!-- What fills the gap between this file arriving and React starting.
         It was a blank white page, which on a phone on a slow connection is the
         first thing anybody sees. React replaces #root wholesale when it mounts,
         so nothing needs to remove this. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        /* The same gradient as StartupScreen and the native Android splash, so
           the handover between the three is invisible. */
        background: linear-gradient(180deg, #10294c 0%, #143257 55%, #0d2444 100%);
        color: #eaf1fb;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      /* 16px, not a round number picked by eye: logo.svg is a 128 square with
         rx=26, so its corners are 20.3% and at 78px that is 15.8. A larger
         radius shaved the blue corners off the artwork and left the shadow
         tracing a shape the logo does not have. */
      #boot img { width: 78px; height: 78px; border-radius: 16px; box-shadow: 0 12px 34px -12px rgba(0,0,0,.6); }
      /* Grouped so the name and the credit sit close together, rather than
         each taking the 18px gap the column uses between its three parts.
         Matches StartupScreen, which hands over to this. */
      #boot .boot-name { display: flex; flex-direction: column; align-items: center; gap: 6px; }
      #boot span { font-size: 27px; font-weight: 800; letter-spacing: -0.5px; }
      #boot small { font-size: 12.5px; letter-spacing: 0.3px; color: rgba(234, 241, 251, 0.62); }
      #boot i {
        width: 132px; height: 3px; border-radius: 999px; overflow: hidden;
        background: rgba(234,241,251,.16); position: relative;
      }
      /* Fills from nothing to full rather than sweeping back and forth. A
         sweep says "still working"; a fill says how far along it is, and it can
         actually finish — which is what makes waiting for 100% mean something
         rather than being a pause dressed up as progress. */
      #boot i b {
        display: block; height: 100%; width: 0; border-radius: 999px;
        background: #7cb8ff; transition: width .25s ease-out;
      }
      /* Sits over the app until it is ready, then goes. Fixed rather than in
         the flow, because #root is behind it and already has the whole page. */
      #boot { position: fixed; inset: 0; z-index: 9999; transition: opacity .28s ease-out; }
      #boot.done { opacity: 0; pointer-events: none; }
    </style>
    <div id=root></div>
    <div id=boot>
      <img src=/logo.svg alt=Taxify width=78 height=78 />
      <div class="boot-name">
        <span>Taxify</span>
        <small>Powered by Mikes App Hub</small>
      </div>
      <i><b></b></i>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
