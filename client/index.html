<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The same mark as logo.svg, redrawn for 16 pixels. See favicon.svg. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1559b8" />
    <title>Taxify - Powered by Mikes App Hub</title>
  </head>
  <body>
    <!-- What fills the gap between this file arriving and React starting.
         It was a blank white page, which on a phone on a slow connection is the
         first thing anybody sees. React replaces #root wholesale when it mounts,
         so nothing needs to remove this. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        /* The same gradient as StartupScreen and the native Android splash, so
           the handover between the three is invisible. */
        background: linear-gradient(180deg, #10294c 0%, #143257 55%, #0d2444 100%);
        color: #eaf1fb;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      /* 16px, not a round number picked by eye: logo.svg is a 128 square with
         rx=26, so its corners are 20.3% and at 78px that is 15.8. A larger
         radius shaved the blue corners off the artwork and left the shadow
         tracing a shape the logo does not have. */
      #boot img { width: 78px; height: 78px; border-radius: 16px; box-shadow: 0 12px 34px -12px rgba(0,0,0,.6); }
      /* Grouped so the name and the credit sit close together, rather than
         each taking the 18px gap the column uses between its three parts.
         Matches StartupScreen, which hands over to this. */
      #boot .boot-name { display: flex; flex-direction: column; align-items: center; gap: 6px; }
      #boot span { font-size: 27px; font-weight: 800; letter-spacing: -0.5px; }
      #boot small { font-size: 12.5px; letter-spacing: 0.3px; color: rgba(234, 241, 251, 0.62); }
      #boot i {
        width: 132px; height: 3px; border-radius: 999px; overflow: hidden;
        background: rgba(234,241,251,.16); position: relative;
      }
      /* Fills from nothing to full rather than sweeping back and forth. A
         sweep says "still working"; a fill says how far along it is, and it can
         actually finish — which is what makes waiting for 100% mean something
         rather than being a pause dressed up as progress. */
      #boot i b {
        display: block; height: 100%; width: 0; border-radius: 999px;
        background: #7cb8ff; transition: width .25s ease-out;
      }
      /* Sits over the app until it is ready, then goes. Fixed rather than in
         the flow, because #root is behind it and already has the whole page. */
      #boot { position: fixed; inset: 0; z-index: 9999; transition: opacity .28s ease-out; }
      #boot.done { opacity: 0; pointer-events: none; }
    </style>
    <div id=root></div>
    <div id=boot>
      <img src=/logo.svg alt=Taxify width=78 height=78 />
      <div class="boot-name">
        <span>Taxify</span>
        <small>Powered by Mikes App Hub</small>
      </div>
      <i><b></b></i>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
