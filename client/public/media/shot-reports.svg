<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="A report comparing each category across financial years">
  <!-- Drawn rather than screenshotted. See shot-dashboard.svg. Ids prefixed sr-. -->
  <defs>
    <linearGradient id="sr-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <clipPath id="sr-card"><rect x="20" y="20" width="440" height="320" rx="14"/></clipPath>
  </defs>

  <rect x="20" y="20" width="440" height="320" rx="14" fill="#101a2b" stroke="#1e2c3f" stroke-width="1.5"/>
  <g clip-path="url(#sr-card)">
    <rect x="20" y="20" width="440" height="56" fill="#0f1826"/>
    <rect x="40" y="36" width="78" height="10" rx="5" fill="#e8eef7" opacity="0.88"/>
    <rect x="40" y="54" width="122" height="6" rx="3" fill="#8fa2ba" opacity="0.5"/>
    <rect x="356" y="34" width="84" height="24" rx="8" fill="#16233a" stroke="#22344f"/>
    <rect x="368" y="42" width="46" height="7" rx="3.5" fill="#8fa2ba" opacity="0.7"/>

    <!-- Column headings: category, two years, total, share -->
    <g fill="#8fa2ba" opacity="0.5">
      <rect x="40" y="92" width="52" height="6" rx="3"/>
      <rect x="196" y="92" width="34" height="6" rx="3"/>
      <rect x="256" y="92" width="34" height="6" rx="3"/>
      <rect x="316" y="92" width="30" height="6" rx="3"/>
      <rect x="372" y="92" width="30" height="6" rx="3"/>
    </g>
    <rect x="40" y="106" width="400" height="1" fill="#1e2c3f"/>

    <!-- Rows, each with a share bar so the eye finds the big ones -->
    <g>
      <g transform="translate(0,0)">
        <circle cx="46" cy="126" r="4.5" fill="#3b82f6"/>
        <rect x="58" y="122" width="82" height="8" rx="4" fill="#e8eef7" opacity="0.8"/>
        <rect x="196" y="122" width="42" height="8" rx="4" fill="#8fa2ba" opacity="0.55"/>
        <rect x="256" y="122" width="42" height="8" rx="4" fill="#e8eef7" opacity="0.72"/>
        <rect x="316" y="122" width="38" height="8" rx="4" fill="#e8eef7" opacity="0.72"/>
        <rect x="372" y="123" width="68" height="7" rx="3.5" fill="#16233a"/>
        <rect x="372" y="123" width="52" height="7" rx="3.5" fill="url(#sr-bar)"/>
      </g>
      <g transform="translate(0,34)">
        <circle cx="46" cy="126" r="4.5" fill="#10b981"/>
        <rect x="58" y="122" width="64" height="8" rx="4" fill="#e8eef7" opacity="0.8"/>
        <rect x="196" y="122" width="42" height="8" rx="4" fill="#8fa2ba" opacity="0.55"/>
        <rect x="256" y="122" width="42" height="8" rx="4" fill="#e8eef7" opacity="0.72"/>
        <rect x="316" y="122" width="38" height="8" rx="4" fill="#e8eef7" opacity="0.72"/>
        <rect x="372" y="123" width="68" height="7" rx="3.5" fill="#16233a"/>
        <rect x="372" y="123" width="38" height="7" rx="3.5" fill="url(#sr-bar)"/>
      </g>
      <g transform="translate(0,68)">
        <circle cx="46" cy="126" r="4.5" fill="#06b6d4"/>
        <rect x="58" y="122" width="94" height="8" rx="4" fill="#e8eef7" opacity="0.8"/>
        <rect x="196" y="122" width="42" height="8" rx="4" fill="#8fa2ba" opacity="0.55"/>
        <rect x="256" y="122" width="42" height="8" rx="4" fill="#e8eef7" opacity="0.72"/>
        <rect x="316" y="122" width="38" height="8" rx="4" fill="#e8eef7" opacity="0.72"/>
        <rect x="372" y="123" width="68" height="7" rx="3.5" fill="#16233a"/>
        <rect x="372" y="123" width="27" height="7" rx="3.5" fill="url(#sr-bar)"/>
      </g>
      <g transform="translate(0,102)">
        <circle cx="46" cy="126" r="4.5" fill="#8b5cf6"/>
        <rect x="58" y="122" width="72" height="8" rx="4" fill="#e8eef7" opacity="0.8"/>
        <rect x="196" y="122" width="42" height="8" rx="4" fill="#8fa2ba" opacity="0.55"/>
        <rect x="256" y="122" width="42" height="8" rx="4" fill="#e8eef7" opacity="0.72"/>
        <rect x="316" y="122" width="38" height="8" rx="4" fill="#e8eef7" opacity="0.72"/>
        <rect x="372" y="123" width="68" height="7" rx="3.5" fill="#16233a"/>
        <rect x="372" y="123" width="18" height="7" rx="3.5" fill="url(#sr-bar)"/>
      </g>
      <g transform="translate(0,136)">
        <circle cx="46" cy="126" r="4.5" fill="#f59e0b"/>
        <rect x="58" y="122" width="58" height="8" rx="4" fill="#e8eef7" opacity="0.8"/>
        <rect x="196" y="122" width="42" height="8" rx="4" fill="#8fa2ba" opacity="0.55"/>
        <rect x="256" y="122" width="42" height="8" rx="4" fill="#e8eef7" opacity="0.72"/>
        <rect x="316" y="122" width="38" height="8" rx="4" fill="#e8eef7" opacity="0.72"/>
        <rect x="372" y="123" width="68" height="7" rx="3.5" fill="#16233a"/>
        <rect x="372" y="123" width="12" height="7" rx="3.5" fill="url(#sr-bar)"/>
      </g>
    </g>

    <!-- Total row -->
    <rect x="40" y="292" width="400" height="1" fill="#1e2c3f"/>
    <rect x="40" y="306" width="46" height="8" rx="4" fill="#8fa2ba" opacity="0.6"/>
    <text x="354" y="315" text-anchor="end" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="800" fill="#e8eef7">$12,480</text>
  </g>
</svg>
