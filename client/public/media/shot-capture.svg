<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 8 280 344" width="480" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Photographing a receipt on a phone and filing it in one tap">
  <!-- Drawn rather than screenshotted. See shot-dashboard.svg. Ids prefixed sc-. -->
  <defs>
    <linearGradient id="sc-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <clipPath id="sc-phone"><rect x="146" y="22" width="188" height="316" rx="26"/></clipPath>
  </defs>

  <rect x="140" y="16" width="200" height="328" rx="30" fill="#0a0f18" stroke="#22344f" stroke-width="2"/>
  <g clip-path="url(#sc-phone)">
    <rect x="146" y="22" width="188" height="316" fill="#111a29"/>

    <!-- What the camera sees -->
    <g>
      <rect x="178" y="52" width="124" height="152" rx="5" fill="#f4f6fa"/>
      <rect x="192" y="70" width="58" height="7" rx="3.5" fill="#0a0f18" opacity="0.75"/>
      <rect x="192" y="86" width="94" height="4.5" rx="2.25" fill="#0a0f18" opacity="0.26"/>
      <rect x="192" y="98" width="82" height="4.5" rx="2.25" fill="#0a0f18" opacity="0.26"/>
      <rect x="192" y="110" width="88" height="4.5" rx="2.25" fill="#0a0f18" opacity="0.26"/>
      <rect x="192" y="132" width="46" height="4.5" rx="2.25" fill="#0a0f18" opacity="0.26"/>
      <rect x="192" y="156" width="42" height="9" rx="4.5" fill="#0a0f18" opacity="0.7"/>
      <rect x="252" y="154" width="36" height="11" rx="5.5" fill="#2563eb"/>
      <path d="M178 204 l10 -8 l10 8 l10 -8 l10 8 l10 -8 l10 8 l10 -8 l10 8 l10 -8 l10 8 l10 -8 l10 8 v5 h-124 z" fill="#111a29"/>
    </g>
    <g stroke="#3ddc84" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M168 70 v-16 h16"/><path d="M312 70 v-16 h-16"/>
      <path d="M168 186 v16 h16"/><path d="M312 186 v16 h-16"/>
