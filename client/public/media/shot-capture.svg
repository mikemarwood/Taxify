    <path d="M232 256 l6 6 l11 -12" stroke="#3ddc84" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="186" y="284" width="108" height="8" rx="4" fill="#e8eef7" opacity="0.85"/>
    <rect x="166" y="302" width="148" height="6" rx="3" fill="#8fa2ba" opacity="0.5"/>
    <rect x="196" y="318" width="88" height="14" rx="7" fill="rgba(59,130,246,0.18)" stroke="#3b82f6" stroke-opacity="0.4"/>
  </g>
  <rect x="204" y="30" width="72" height="6" rx="3" fill="#22344f"/>

