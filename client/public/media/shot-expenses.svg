<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="A list of expenses sorted into categories with a running total">
  <!-- Drawn rather than screenshotted. See shot-dashboard.svg. Ids prefixed se-. -->
  <defs>
    <clipPath id="se-card"><rect x="20" y="20" width="440" height="320" rx="14"/></clipPath>
  </defs>

  <rect x="20" y="20" width="440" height="320" rx="14" fill="#101a2b" stroke="#1e2c3f" stroke-width="1.5"/>
  <g clip-path="url(#se-card)">
    <!-- Header: which books, which year, the total -->
    <rect x="20" y="20" width="440" height="60" fill="#0f1826"/>
    <rect x="40" y="38" width="96" height="10" rx="5" fill="#e8eef7" opacity="0.88"/>
    <rect x="40" y="56" width="130" height="6" rx="3" fill="#8fa2ba" opacity="0.5"/>
    <rect x="322" y="34" width="118" height="26" rx="8" fill="#16233a" stroke="#22344f"/>
    <rect x="334" y="43" width="62" height="7" rx="3.5" fill="#8fa2ba" opacity="0.7"/>
    <path d="M424 45 l4 4 l4 -4" stroke="#8fa2ba" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>

    <!-- Date group -->
    <rect x="40" y="94" width="72" height="7" rx="3.5" fill="#8fa2ba" opacity="0.45"/>

    <!-- Rows: date · name · category · amount -->
    <g>
      <g transform="translate(0,0)">
        <rect x="34" y="110" width="412" height="42" rx="9" fill="#0f1826"/>
        <rect x="48" y="127" width="34" height="7" rx="3.5" fill="#8fa2ba" opacity="0.5"/>
        <rect x="96" y="123" width="96" height="8" rx="4" fill="#e8eef7" opacity="0.85"/>
        <rect x="96" y="137" width="54" height="6" rx="3" fill="#8fa2ba" opacity="0.4"/>
        <rect x="248" y="122" width="86" height="20" rx="10" fill="rgba(59,130,246,0.15)" stroke="#3b82f6" stroke-opacity="0.4"/>
        <circle cx="261" cy="132" r="4" fill="#60a5fa"/>
        <rect x="271" y="129" width="50" height="6" rx="3" fill="#60a5fa" opacity="0.9"/>
        <rect x="380" y="126" width="52" height="10" rx="5" fill="#e8eef7" opacity="0.8"/>
      </g>
      <g transform="translate(0,52)">
        <rect x="34" y="110" width="412" height="42" rx="9" fill="#0f1826"/>
        <rect x="48" y="127" width="34" height="7" rx="3.5" fill="#8fa2ba" opacity="0.5"/>
        <rect x="96" y="123" width="76" height="8" rx="4" fill="#e8eef7" opacity="0.85"/>
        <rect x="96" y="137" width="64" height="6" rx="3" fill="#8fa2ba" opacity="0.4"/>
        <rect x="248" y="122" width="76" height="20" rx="10" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-opacity="0.4"/>
        <circle cx="261" cy="132" r="4" fill="#3ddc84"/>
        <rect x="271" y="129" width="40" height="6" rx="3" fill="#3ddc84" opacity="0.9"/>
        <rect x="386" y="126" width="46" height="10" rx="5" fill="#e8eef7" opacity="0.8"/>
      </g>
      <g transform="translate(0,104)">
        <rect x="34" y="110" width="412" height="42" rx="9" fill="#0f1826"/>
        <rect x="48" y="127" width="34" height="7" rx="3.5" fill="#8fa2ba" opacity="0.5"/>
        <rect x="96" y="123" width="104" height="8" rx="4" fill="#e8eef7" opacity="0.85"/>
        <rect x="96" y="137" width="48" height="6" rx="3" fill="#8fa2ba" opacity="0.4"/>
        <rect x="248" y="122" width="92" height="20" rx="10" fill="rgba(6,182,212,0.15)" stroke="#06b6d4" stroke-opacity="0.4"/>
        <circle cx="261" cy="132" r="4" fill="#22d3ee"/>
        <rect x="271" y="129" width="56" height="6" rx="3" fill="#22d3ee" opacity="0.9"/>
        <rect x="378" y="126" width="54" height="10" rx="5" fill="#e8eef7" opacity="0.8"/>
        <!-- a receipt is attached to this one -->
        <rect x="350" y="124" width="14" height="16" rx="2.5" fill="#16233a" stroke="#2c3b52"/>
      </g>
    </g>

    <!-- Running total -->
    <rect x="20" y="284" width="440" height="56" fill="#0d1626"/>
    <rect x="40" y="304" width="86" height="8" rx="4" fill="#8fa2ba" opacity="0.55"/>
    <text x="440" y="316" text-anchor="end" font-family="Inter, Segoe UI, sans-serif" font-size="19" font-weight="800" fill="#e8eef7">$3,214.60</text>
  </g>
</svg>
