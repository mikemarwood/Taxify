<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" role="img" aria-label="The Taxify dashboard on a laptop, with the phone app beside it">
  <!--
    Drawn, not screenshotted.

    There is no way to photograph a real account without putting somebody's
    expenses on a public page, and a drawing stays sharp at any size without
    shipping a bitmap. It shows the shape of the thing — the layout, the flow,
    the kind of figures — rather than exact numbers that would imply precision
    the page has no business claiming.

    Ids are prefixed sd- because more than one of these mockups appears on the
    same page and gradient ids are global.
  -->
  <defs>
    <linearGradient id="sd-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="0.55" stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="sd-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <clipPath id="sd-screen"><rect x="40" y="40" width="700" height="440" rx="14"/></clipPath>
    <clipPath id="sd-phone"><rect x="640" y="150" width="220" height="380" rx="30"/></clipPath>
  </defs>

  <!-- ── Laptop window ─────────────────────────────────────────────── -->
  <rect x="40" y="40" width="700" height="440" rx="14" fill="#101a2b" stroke="#1e2c3f" stroke-width="1.5"/>

  <g clip-path="url(#sd-screen)">
    <!-- Title bar -->
    <rect x="40" y="40" width="700" height="34" fill="#0f1826"/>
    <circle cx="60" cy="57" r="4" fill="#2c3b52"/><circle cx="74" cy="57" r="4" fill="#2c3b52"/><circle cx="88" cy="57" r="4" fill="#2c3b52"/>
    <rect x="300" y="49" width="180" height="16" rx="8" fill="#0a0f18"/>

    <!-- Sidebar -->
    <rect x="40" y="74" width="150" height="406" fill="#0d1626"/>
    <rect x="56" y="92" width="20" height="20" rx="6" fill="url(#sd-brand)"/>
    <rect x="84" y="98" width="52" height="9" rx="4.5" fill="#e8eef7" opacity="0.85"/>

    <!-- Books picker -->
    <rect x="56" y="126" width="118" height="26" rx="7" fill="#16233a" stroke="#22344f"/>
    <rect x="66" y="135" width="62" height="8" rx="4" fill="#8fa2ba" opacity="0.7"/>

    <!-- Nav items, the third one selected -->
    <g fill="#8fa2ba" opacity="0.55">
      <rect x="56" y="170" width="70" height="8" rx="4"/>
      <rect x="56" y="196" width="54" height="8" rx="4"/>
    </g>
    <rect x="50" y="216" width="130" height="26" rx="7" fill="#16233a"/>
    <rect x="50" y="222" width="3" height="14" rx="1.5" fill="#3b82f6"/>
    <rect x="62" y="225" width="76" height="8" rx="4" fill="#e8eef7" opacity="0.9"/>
    <g fill="#8fa2ba" opacity="0.55">
      <rect x="56" y="256" width="62" height="8" rx="4"/>
      <rect x="56" y="282" width="80" height="8" rx="4"/>
      <rect x="56" y="308" width="58" height="8" rx="4"/>
    </g>

    <!-- Page heading -->
    <rect x="214" y="98" width="132" height="13" rx="6.5" fill="#e8eef7" opacity="0.9"/>
    <rect x="214" y="119" width="210" height="8" rx="4" fill="#8fa2ba" opacity="0.55"/>

    <!-- Three summary tiles -->
    <g>
      <rect x="214" y="146" width="158" height="80" rx="10" fill="#0f1826" stroke="#1e2c3f"/>
      <rect x="230" y="162" width="54" height="7" rx="3.5" fill="#8fa2ba" opacity="0.6"/>
      <text x="230" y="199" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#e8eef7">$12,480</text>
      <rect x="230" y="208" width="72" height="6" rx="3" fill="#10b981" opacity="0.55"/>

      <rect x="372" y="146" width="146" height="80" rx="10" fill="#0f1826" stroke="#1e2c3f"/>
      <rect x="388" y="162" width="44" height="7" rx="3.5" fill="#8fa2ba" opacity="0.6"/>
      <text x="388" y="199" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#e8eef7">318</text>
      <rect x="388" y="208" width="60" height="6" rx="3" fill="#8fa2ba" opacity="0.4"/>

      <rect x="530" y="146" width="146" height="80" rx="10" fill="#0f1826" stroke="#1e2c3f"/>
      <rect x="546" y="162" width="62" height="7" rx="3.5" fill="#8fa2ba" opacity="0.6"/>
      <text x="546" y="199" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#3ddc84">$4,058</text>
      <rect x="546" y="208" width="80" height="6" rx="3" fill="#8fa2ba" opacity="0.4"/>
    </g>

    <!-- Spend by category -->
    <rect x="214" y="242" width="296" height="222" rx="10" fill="#0f1826" stroke="#1e2c3f"/>
    <rect x="230" y="258" width="96" height="8" rx="4" fill="#e8eef7" opacity="0.75"/>
    <g>
      <rect x="238" y="404" width="30" height="42" rx="4" fill="url(#sd-bar)"/>
      <rect x="284" y="376" width="30" height="70" rx="4" fill="url(#sd-bar)"/>
      <rect x="330" y="336" width="30" height="110" rx="4" fill="url(#sd-bar)"/>
      <rect x="376" y="352" width="30" height="94" rx="4" fill="url(#sd-bar)"/>
      <rect x="422" y="298" width="30" height="148" rx="4" fill="url(#sd-bar)"/>
      <rect x="468" y="388" width="30" height="58" rx="4" fill="url(#sd-bar)"/>
    </g>
    <rect x="230" y="452" width="264" height="1" fill="#1e2c3f"/>

    <!-- Recent expenses -->
    <rect x="522" y="242" width="154" height="222" rx="10" fill="#0f1826" stroke="#1e2c3f"/>
    <rect x="538" y="258" width="80" height="8" rx="4" fill="#e8eef7" opacity="0.75"/>
    <g>
      <g transform="translate(0,0)">
        <rect x="538" y="280" width="122" height="30" rx="6" fill="#16233a"/>
        <circle cx="552" cy="295" r="5" fill="#3b82f6"/>
        <rect x="564" y="288" width="58" height="6" rx="3" fill="#e8eef7" opacity="0.75"/>
        <rect x="564" y="299" width="34" height="5" rx="2.5" fill="#8fa2ba" opacity="0.5"/>
        <rect x="628" y="291" width="30" height="7" rx="3.5" fill="#e8eef7" opacity="0.6"/>
      </g>
      <g transform="translate(0,40)">
        <rect x="538" y="280" width="122" height="30" rx="6" fill="#16233a"/>
        <circle cx="552" cy="295" r="5" fill="#10b981"/>
        <rect x="564" y="288" width="48" height="6" rx="3" fill="#e8eef7" opacity="0.75"/>
        <rect x="564" y="299" width="40" height="5" rx="2.5" fill="#8fa2ba" opacity="0.5"/>
        <rect x="628" y="291" width="30" height="7" rx="3.5" fill="#e8eef7" opacity="0.6"/>
      </g>
      <g transform="translate(0,80)">
        <rect x="538" y="280" width="122" height="30" rx="6" fill="#16233a"/>
        <circle cx="552" cy="295" r="5" fill="#06b6d4"/>
        <rect x="564" y="288" width="64" height="6" rx="3" fill="#e8eef7" opacity="0.75"/>
        <rect x="564" y="299" width="30" height="5" rx="2.5" fill="#8fa2ba" opacity="0.5"/>
        <rect x="628" y="291" width="30" height="7" rx="3.5" fill="#e8eef7" opacity="0.6"/>
      </g>
      <g transform="translate(0,120)">
        <rect x="538" y="280" width="122" height="30" rx="6" fill="#16233a"/>
        <circle cx="552" cy="295" r="5" fill="#3b82f6"/>
        <rect x="564" y="288" width="54" height="6" rx="3" fill="#e8eef7" opacity="0.75"/>
        <rect x="564" y="299" width="36" height="5" rx="2.5" fill="#8fa2ba" opacity="0.5"/>
        <rect x="628" y="291" width="30" height="7" rx="3.5" fill="#e8eef7" opacity="0.6"/>
      </g>
    </g>
  </g>

  <!-- ── Phone, overlapping ────────────────────────────────────────── -->
  <rect x="634" y="144" width="232" height="392" rx="34" fill="#0a0f18" stroke="#22344f" stroke-width="2"/>
  <g clip-path="url(#sd-phone)">
    <rect x="640" y="150" width="220" height="380" fill="#0d1626"/>

    <!-- Camera view holding a docket -->
    <rect x="640" y="150" width="220" height="228" fill="#111a29"/>
    <g>
      <rect x="678" y="176" width="144" height="180" rx="6" fill="#f4f6fa"/>
      <rect x="694" y="196" width="70" height="8" rx="4" fill="#0a0f18" opacity="0.75"/>
      <rect x="694" y="214" width="112" height="5" rx="2.5" fill="#0a0f18" opacity="0.28"/>
      <rect x="694" y="228" width="98" height="5" rx="2.5" fill="#0a0f18" opacity="0.28"/>
      <rect x="694" y="242" width="106" height="5" rx="2.5" fill="#0a0f18" opacity="0.28"/>
      <rect x="694" y="268" width="60" height="5" rx="2.5" fill="#0a0f18" opacity="0.28"/>
      <rect x="694" y="296" width="52" height="10" rx="5" fill="#0a0f18" opacity="0.7"/>
      <rect x="762" y="294" width="44" height="12" rx="6" fill="#2563eb"/>
      <!-- torn edge -->
      <path d="M678 356 l12 -9 l12 9 l12 -9 l12 9 l12 -9 l12 9 l12 -9 l12 9 l12 -9 l12 9 l12 -9 l12 9 v6 h-144 z" fill="#111a29"/>
    </g>
    <!-- Focus corners -->
    <g stroke="#3ddc84" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M666 196 v-18 h18"/><path d="M834 196 v-18 h-18"/>
      <path d="M666 336 v18 h18"/><path d="M834 336 v18 h-18"/>
    </g>

    <!-- Sheet below -->
    <rect x="640" y="378" width="220" height="152" fill="#0f1826"/>
    <rect x="662" y="396" width="86" height="9" rx="4.5" fill="#e8eef7" opacity="0.85"/>
    <rect x="662" y="416" width="176" height="30" rx="8" fill="#16233a" stroke="#22344f"/>
    <rect x="674" y="427" width="64" height="8" rx="4" fill="#8fa2ba" opacity="0.7"/>
    <g>
      <rect x="662" y="456" width="60" height="22" rx="11" fill="rgba(59,130,246,0.16)" stroke="#3b82f6" stroke-opacity="0.45"/>
      <rect x="674" y="464" width="36" height="6" rx="3" fill="#60a5fa"/>
      <rect x="730" y="456" width="56" height="22" rx="11" fill="#16233a" stroke="#22344f"/>
      <rect x="742" y="464" width="32" height="6" rx="3" fill="#8fa2ba" opacity="0.6"/>
    </g>
    <rect x="662" y="490" width="176" height="30" rx="9" fill="url(#sd-brand)"/>
    <rect x="716" y="501" width="68" height="8" rx="4" fill="#ffffff" opacity="0.95"/>
    <path d="M700 505 l5 5 l9 -10" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="716" y="158" width="68" height="7" rx="3.5" fill="#22344f"/>
</svg>
